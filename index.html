<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <meta name="description" content="Rohan Verma — interactive portfolio introduction.">
  <title>Rohan Verma — Interactive Portfolio</title>
  <style>
    :root { color-scheme: dark; --bg: #050505; --focus: #48f0b1; }
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; background: var(--bg); }
    body { min-height: 100svh; display: grid; place-items: center; overflow: hidden; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .stage { width: 100%; min-height: 100svh; display: grid; place-items: center; background: #000; }
    .player-shell { position: relative; width: min(100vw, 177.7778svh); aspect-ratio: 16 / 9; max-height: 100svh; overflow: hidden; background: #000; }
    #player { position: absolute; inset: 0; width: 100%; height: 100%; }
    #hotspot-layer { position: absolute; inset: 0; z-index: 5; pointer-events: none; }
    /* Green outline drawn INSIDE the box (inset shadow) so it never grows past the preview frame.
       The interior stays fully transparent so the document preview underneath is never covered. */
    .hotspot { position: absolute; display: block; pointer-events: auto; background: transparent; border: 0; outline: none; cursor: pointer; border-radius: 6px; box-shadow: inset 0 0 0 2px var(--focus); transform-origin: 0 0; }
    .hotspot:hover { box-shadow: inset 0 0 0 3px var(--focus); }
    .hotspot:focus-visible { box-shadow: inset 0 0 0 4px var(--focus); }
    .hotspot[hidden] { display: none; }
    /* Press "O" (or load with ?outlines=0) to hide the outlines; the clickable areas stay active. */
    body.hide-outlines .hotspot, body.hide-outlines .hotspot:hover, body.hide-outlines .hotspot:focus-visible { box-shadow: none; }
    .status { position: fixed; left: 12px; bottom: 12px; z-index: 20; color: #aaa; background: #111d; padding: 6px 9px; border-radius: 6px; font-size: 12px; pointer-events: none; }
    .status:empty { display: none; }
    @media (max-aspect-ratio: 16/9) { .player-shell { width: 100vw; max-height: none; } }
  </style>
</head>
<body>
  <main class="stage">
    <div class="player-shell" id="player-shell">
      <div id="player" aria-label="Rohan Verma introduction video"></div>
      <nav id="hotspot-layer" aria-label="Interactive portfolio links"></nav>
    </div>
  </main>
  <div id="status" class="status" role="status" aria-live="polite"></div>
  <script>
    (() => {
      'use strict';
      const VIDEO_ID = 'AMMDnDzMjIA';
      const SITE_URL = 'https://vitalgenix-website.vercel.app/';
      const END_CARD_HOLD_AT = 109.05;
      const END_CARD_SEEK_TO = 108.65;
      // Geometry is in % of the 16:9 video frame: x/y = top-left corner of the on-screen element, w/h = its size.
      // Optional `shear` {x, y} (unitless ratios) tilts the box to follow a card that sits at a slight angle,
      // so the outline hugs the card instead of a larger bounding box.
      // start/end are VIDEO SECONDS and cover only the time the element is fully formed on screen:
      // start = first moment the build-in animation has finished, end = moment before its exit animation begins.
      // (Measured frame by frame, 0.05-0.1 s steps, from the published video.)
      const hotspots = [
        { id: 'indcx-pitch-deck', label: 'Open INDCX pitch deck', start: 37.55, end: 42.35, x: 8.08, y: 59.73, w: 24.97, h: 30.27, shear: { x: -0.0271, y: 0.0340 }, url: 'https://drive.google.com/file/d/1a2ZvtKw9oQVgWvZTZkuXYr4Yxnnd10xX/view?usp=sharing' },
        { id: 'website-callout', label: 'Open VitalGenix website', start: 48.02, end: 50.68, x: 67.72, y: 74.25, w: 22.96, h: 14.52, url: SITE_URL },
        { id: 'website-callout-link', label: 'Open VitalGenix website (Open link)', start: 48.07, end: 50.68, x: 75.27, y: 89.73, w: 8.63, h: 3.42, url: SITE_URL },
        { id: 'founders-brief', label: "Open Founder's Brief", start: 52.72, end: 59.12, x: 3.46, y: 5.62, w: 15.49, h: 19.45, url: 'https://drive.google.com/file/d/1tSpr1MRQXqQi_ai105GBbV0MCXQxMYsf/view?usp=sharing' },
        { id: 'product-teardown', label: 'Open VitalGenix PDF product teardown', start: 52.92, end: 59.17, x: 3.46, y: 27.81, w: 15.49, h: 19.04, url: 'https://drive.google.com/file/d/1rabmr4TQIwkpbufg06dEe6FJZqO0oEA8/view?usp=sharing' },
        { id: 'funnel-case-study', label: 'Open VitalGenix Funnel case study', start: 53.12, end: 59.22, x: 3.46, y: 49.86, w: 15.49, h: 19.04, url: 'https://drive.google.com/file/d/1qx51QseNyYEsS-0xvug9LPk0YJL-I8Pk/view?usp=sharing' },
        { id: 'website-end-card', label: 'Open VitalGenix website from the closing card', start: 108.5, end: 111.0, x: 37.36, y: 56.71, w: 25.35, h: 14.38, url: SITE_URL },
        { id: 'website-end-card-link', label: 'Open VitalGenix website from the closing card (Open link)', start: 108.58, end: 111.0, x: 46.46, y: 72.19, w: 8.17, h: 3.29, url: SITE_URL }
      ];
      const layer = document.getElementById('hotspot-layer');
      const status = document.getElementById('status');
      const links = new Map();
      let player = null;
      let timer = null;
      let endCardHeld = false;
      let lastVideoTime = 0;

      const params = new URLSearchParams(location.search);
      if (params.get('outlines') === '0') document.body.classList.add('hide-outlines');

      for (const card of hotspots) {
        const link = document.createElement('a');
        link.className = 'hotspot';
        link.href = card.url;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        link.title = card.label;
        link.setAttribute('aria-label', card.label);
        link.dataset.hotspotId = card.id;
        link.hidden = true;
        link.tabIndex = -1;
        link.style.left = card.x + '%';
        link.style.top = card.y + '%';
        link.style.width = card.w + '%';
        link.style.height = card.h + '%';
        if (card.shear) link.style.transform = 'matrix(1,' + card.shear.y + ',' + card.shear.x + ',1,0,0)';
        link.addEventListener('click', () => { status.textContent = 'Opening ' + card.label + ' in a new tab.'; });
        layer.appendChild(link);
        links.set(card.id, link);
      }

      function updateHotspots(time) {
        for (const card of hotspots) {
          const link = links.get(card.id);
          const active = time >= card.start && time < card.end;
          link.hidden = !active;
          link.tabIndex = active ? 0 : -1;
          link.setAttribute('aria-hidden', String(!active));
        }
      }

      // YouTube only reports its clock every so often, so the page remembers when each new value arrived and
      // extends it while the video is playing. That keeps the hotspots switching on and off within a few
      // milliseconds of the animation edges instead of lagging by up to a quarter of a second.
      let anchorVideo = 0;
      let anchorWall = 0;
      let lastReported = null;

      function currentVideoTime() {
        if (!player || typeof player.getCurrentTime !== 'function') return null;
        const reported = player.getCurrentTime();
        if (!Number.isFinite(reported)) return null;
        const now = performance.now();
        if (reported !== lastReported) { lastReported = reported; anchorVideo = reported; anchorWall = now; }
        const playing = typeof player.getPlayerState === 'function' && player.getPlayerState() === YT.PlayerState.PLAYING;
        if (!playing) return anchorVideo;
        const rate = typeof player.getPlaybackRate === 'function' ? (player.getPlaybackRate() || 1) : 1;
        return anchorVideo + Math.min((now - anchorWall) / 1000, 0.3) * rate;
      }

      function tick() {
        const time = currentVideoTime();
        if (time === null) return;
        updateHotspots(time);
        if (time < 107.5) endCardHeld = false;
        if (!endCardHeld && time >= END_CARD_HOLD_AT && lastVideoTime < END_CARD_HOLD_AT) {
          endCardHeld = true;
          player.pauseVideo();
          player.seekTo(END_CARD_SEEK_TO, true);
          lastReported = null;
          updateHotspots(END_CARD_SEEK_TO);
        }
        lastVideoTime = time;
      }

      window.onYouTubeIframeAPIReady = function () {
        player = new YT.Player('player', {
          videoId: VIDEO_ID,
          width: '100%',
          height: '100%',
          playerVars: {
            autoplay: 1,
            controls: 1,
            playsinline: 1,
            rel: 0,
            enablejsapi: 1,
            origin: location.origin
          },
          events: {
            onReady: function (event) {
              // Requests autoplay; browsers may still require a viewer gesture for audible playback.
              event.target.playVideo();
              timer = window.setInterval(tick, 25);
            },
            onStateChange: function (event) {
              if (event.data === YT.PlayerState.PLAYING) status.textContent = '';
              if (event.data === YT.PlayerState.ENDED) updateHotspots(110);
            },
            onError: function (event) {
              status.textContent = 'The embedded video could not load (YouTube error ' + event.data + '). Check that the video is Unlisted and embedding is allowed.';
            }
          }
        });
      };

      window.addEventListener('keydown', event => {
        if (event.key && event.key.toLowerCase() === 'o' && !event.ctrlKey && !event.metaKey && !event.altKey) {
          const tag = document.activeElement && document.activeElement.tagName;
          if (tag === 'INPUT' || tag === 'TEXTAREA') return;
          document.body.classList.toggle('hide-outlines');
          status.textContent = document.body.classList.contains('hide-outlines') ? 'Hotspot outlines hidden.' : 'Hotspot outlines shown.';
        }
      });

      const api = document.createElement('script');
      api.src = 'https://www.youtube.com/iframe_api';
      api.onerror = () => { status.textContent = 'Could not load YouTube player API. Check your internet connection.'; };
      document.head.appendChild(api);
      window.addEventListener('beforeunload', () => { if (timer) window.clearInterval(timer); });
    })();
  </script>
</body>
</html>
