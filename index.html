<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <meta name="description" content="Rohan Verma — interactive portfolio introduction.">
  <title>Rohan Verma — Interactive Portfolio</title>
  <style>
    :root { color-scheme: dark; --bg: #050505; --focus: #48f0b1; }
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; background: var(--bg); }
    body { min-height: 100svh; display: grid; place-items: center; overflow: hidden; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .stage { width: 100%; min-height: 100svh; display: grid; place-items: center; background: #000; }
    .player-shell { position: relative; width: min(100vw, 177.7778svh); aspect-ratio: 16 / 9; max-height: 100svh; overflow: hidden; background: #000; }
    #player { position: absolute; inset: 0; width: 100%; height: 100%; }
    #hotspot-layer { position: absolute; inset: 0; z-index: 5; pointer-events: none; }
    .hotspot { position: absolute; display: block; pointer-events: auto; background: transparent; border: 0; outline: none; cursor: pointer; }
    .hotspot:focus-visible { outline: 3px solid var(--focus); outline-offset: -3px; }
    .hotspot[hidden] { display: none; }
    body.debug-hotspots .hotspot { background: rgba(72, 240, 177, .12); outline: 2px solid var(--focus); }
    .status { position: fixed; left: 12px; bottom: 12px; z-index: 20; color: #aaa; background: #111d; padding: 6px 9px; border-radius: 6px; font-size: 12px; pointer-events: none; }
    .status:empty { display: none; }
    @media (max-aspect-ratio: 16/9) { .player-shell { width: 100vw; max-height: none; } }
  </style>
</head>
<body>
  <main class="stage">
    <div class="player-shell" id="player-shell">
      <div id="player" aria-label="Rohan Verma introduction video"></div>
      <nav id="hotspot-layer" aria-label="Interactive portfolio links"></nav>
    </div>
  </main>
  <div id="status" class="status" role="status" aria-live="polite"></div>
  <script>
    (() => {
      'use strict';
      const VIDEO_ID = 'AMMDnDzMjIA';
      const SITE_URL = 'https://vitalgenix-website.vercel.app/';
      const END_CARD_HOLD_AT = 109.05;
      const END_CARD_SEEK_TO = 108.65;
      const hotspots = [
        { id: 'indcx-pitch-deck', label: 'Open INDCX pitch deck', start: 36.9, end: 42.85, x: 7.0, y: 58.0, w: 27.2, h: 33.8, url: 'https://drive.google.com/file/d/1a2ZvtKw9oQVgWvZTZkuXYr4Yxnnd10xX/view?usp=sharing' },
        { id: 'website-callout', label: 'Open VitalGenix website', start: 47.65, end: 51.1, x: 66.5, y: 71.8, w: 25.0, h: 23.0, url: SITE_URL },
        { id: 'founders-brief', label: "Open Founder's Brief", start: 52.65, end: 60.0, x: 3.0, y: 5.0, w: 16.6, h: 20.3, url: 'https://drive.google.com/file/d/1tSpr1MRQXqQi_ai105GBbV0MCXQxMYsf/view?usp=sharing' },
        { id: 'product-teardown', label: 'Open VitalGenix PDF product teardown', start: 52.65, end: 60.0, x: 3.0, y: 27.2, w: 16.6, h: 20.1, url: 'https://drive.google.com/file/d/1rabmr4TQIwkpbufg06dEe6FJZqO0oEA8/view?usp=sharing' },
        { id: 'funnel-case-study', label: 'Open VitalGenix Funnel case study', start: 52.65, end: 60.0, x: 3.0, y: 49.7, w: 16.6, h: 19.4, url: 'https://drive.google.com/file/d/1qx51QseNyYEsS-0xvug9LPk0YJL-I8Pk/view?usp=sharing' },
        { id: 'website-end-card', label: 'Open VitalGenix website from the closing card', start: 108.3, end: 111.0, x: 35.5, y: 55.0, w: 29.0, h: 22.5, url: SITE_URL }
      ];
      const layer = document.getElementById('hotspot-layer');
      const status = document.getElementById('status');
      const links = new Map();
      let player = null;
      let timer = null;
      let endCardHeld = false;
      let lastVideoTime = 0;

      const params = new URLSearchParams(location.search);
      if (params.has('debug')) document.body.classList.add('debug-hotspots');

      for (const card of hotspots) {
        const link = document.createElement('a');
        link.className = 'hotspot';
        link.href = card.url;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        link.title = card.label;
        link.setAttribute('aria-label', card.label);
        link.dataset.hotspotId = card.id;
        link.hidden = true;
        link.tabIndex = -1;
        link.style.left = card.x + '%';
        link.style.top = card.y + '%';
        link.style.width = card.w + '%';
        link.style.height = card.h + '%';
        link.addEventListener('click', () => { status.textContent = 'Opening ' + card.label + ' in a new tab.'; });
        layer.appendChild(link);
        links.set(card.id, link);
      }

      function updateHotspots(time) {
        for (const card of hotspots) {
          const link = links.get(card.id);
          const active = time >= card.start && time < card.end;
          link.hidden = !active;
          link.tabIndex = active ? 0 : -1;
          link.setAttribute('aria-hidden', String(!active));
        }
      }

      function tick() {
        if (!player || typeof player.getCurrentTime !== 'function') return;
        const time = player.getCurrentTime();
        if (!Number.isFinite(time)) return;
        updateHotspots(time);
        if (time < 107.5) endCardHeld = false;
        if (!endCardHeld && time >= END_CARD_HOLD_AT && lastVideoTime < END_CARD_HOLD_AT) {
          endCardHeld = true;
          player.pauseVideo();
          player.seekTo(END_CARD_SEEK_TO, true);
          updateHotspots(END_CARD_SEEK_TO);
        }
        lastVideoTime = time;
      }

      window.onYouTubeIframeAPIReady = function () {
        player = new YT.Player('player', {
          videoId: VIDEO_ID,
          width: '100%',
          height: '100%',
          playerVars: {
            autoplay: 1,
            controls: 1,
            playsinline: 1,
            rel: 0,
            enablejsapi: 1,
            origin: location.origin
          },
          events: {
            onReady: function (event) {
              // Requests autoplay; browsers may still require a viewer gesture for audible playback.
              event.target.playVideo();
              timer = window.setInterval(tick, 200);
            },
            onStateChange: function (event) {
              if (event.data === YT.PlayerState.PLAYING) status.textContent = '';
              if (event.data === YT.PlayerState.ENDED) updateHotspots(110);
            },
            onError: function (event) {
              status.textContent = 'The embedded video could not load (YouTube error ' + event.data + '). Check that the video is Unlisted and embedding is allowed.';
            }
          }
        });
      };

      window.addEventListener('keydown', event => {
        if (event.key && event.key.toLowerCase() === 'd' && !event.ctrlKey && !event.metaKey && !event.altKey) {
          const tag = document.activeElement && document.activeElement.tagName;
          if (tag === 'INPUT' || tag === 'TEXTAREA') return;
          document.body.classList.toggle('debug-hotspots');
          status.textContent = document.body.classList.contains('debug-hotspots') ? 'Hotspot debug outlines enabled.' : '';
        }
      });

      const api = document.createElement('script');
      api.src = 'https://www.youtube.com/iframe_api';
      api.onerror = () => { status.textContent = 'Could not load YouTube player API. Check your internet connection.'; };
      document.head.appendChild(api);
      window.addEventListener('beforeunload', () => { if (timer) window.clearInterval(timer); });
    })();
  </script>
</body>
</html>
